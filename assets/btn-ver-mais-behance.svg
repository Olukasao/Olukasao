<svg xmlns="http://www.w3.org/2000/svg" width="244" height="52" viewBox="0 0 244 52" role="img" aria-label="Ver mais projetos no Behance">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B53CFF"/>
      <stop offset="1" stop-color="#7A12C4"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="pill"><rect x="2" y="2" width="240" height="48" rx="24"/></clipPath>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #fff; }
    .label { font-size: 16px; font-weight: 700; }
    .be { font-size: 17px; font-weight: 800; fill: #A020F0; }
    .shine { animation: sweep 3s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-120px); } 60%, 100% { transform: translateX(270px); } }
    .arrow { animation: nudge 1.5s ease-in-out infinite; }
    @keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(4px); } }
  </style>
  <g clip-path="url(#pill)">
    <rect x="2" y="2" width="240" height="48" fill="url(#bg)"/>
    <rect class="shine" x="0" y="0" width="90" height="52" fill="url(#shine)" transform="skewX(-20)"/>
  </g>
  <circle cx="28" cy="26" r="16" fill="#fff"/>
  <text class="be" x="28" y="32" text-anchor="middle">Bē</text>
  <text class="label" x="54" y="31.5">Ver mais projetos</text>
  <g class="arrow">
    <path d="M202 26h22m-8-8 8 8-8 8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
