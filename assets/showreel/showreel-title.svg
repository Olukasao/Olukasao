<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
<style>@font-face{font-family:AX;src:url(data:font/woff2;base64,) format('woff2')}
.d{font-family:AX,'Arial Black',sans-serif;fill:#EDEBE6}
.s{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#EDEBE6}
.m{fill:rgba(237,235,230,.58)}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes open{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.ln{transform-origin:48px 0;transform-box:fill-box;animation:draw .7s cubic-bezier(.16,1,.3,1) both}
.slit{transform-origin:center;transform-box:fill-box;animation:open .8s .35s cubic-bezier(.16,1,.3,1) both}
.u1{animation:up .6s .9s cubic-bezier(.16,1,.3,1) both} .u2{animation:up .6s 1.05s cubic-bezier(.16,1,.3,1) both}
.dot{animation:pulse 1.6s ease-in-out infinite}</style>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16121d"/><stop offset=".55" stop-color="#0B0C0E"/></linearGradient>
<clipPath id="c"><rect class="slit" x="0" y="96" width="1200" height="112"/></clipPath></defs>
<rect x=".5" y=".5" width="1199" height="299" rx="24" fill="url(#g)" stroke="rgba(255,255,255,.09)"/>
<circle class="dot" cx="56" cy="58" r="6" fill="#A020F0"/>
<text class="d u1" x="72" y="64" font-size="17" letter-spacing="4">SHOWREEL 2026</text>
<g clip-path="url(#c)"><text class="d" x="48" y="182" font-size="70" letter-spacing="2">LUCAS SOARES</text></g>
<rect class="ln" x="48" y="214" width="640" height="3" fill="#A020F0"/>
<text class="d u2" x="48" y="262" font-size="22" letter-spacing="3">DESIGN<tspan fill="#A020F0">.</tspan>  CODE<tspan fill="#A020F0">.</tspan>  EXPERIENCE<tspan fill="#A020F0">.</tspan></text>
<g class="u2" text-anchor="end"><text class="d" x="1152" y="186" font-size="52">01:00</text>
<text class="s m" x="1152" y="222" font-size="18" letter-spacing="2">60 s · 60 fps · com som</text>
<text class="s m" x="1152" y="250" font-size="18" letter-spacing="2">motion · front-end · sistemas</text></g>
</svg>