<svg xmlns="http://www.w3.org/2000/svg" width="440" height="200" viewBox="0 0 440 200" role="img" aria-label="Estatísticas do GitHub: Contribuições no ano 168, Commits no ano 123, Pull requests 30, Issues 1, Repositórios públicos 12, Estrelas recebidas 4">
  <style>
    .card { fill: none; stroke: #A020F0; stroke-opacity: .35; }
    .title { font: 700 17px 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #A020F0; }
    .label { font: 500 13px 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #59636e; }
    .value { font: 700 14px 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #1f2328; }
    .icon { fill: #A020F0; }
    .track { fill: #8b949e; fill-opacity: .2; }
    .row { opacity: 0; animation: in .5s ease-out forwards; }
    @keyframes in { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
    .grow { transform-box: fill-box; transform-origin: left; animation: grow 1s cubic-bezier(.2,.8,.2,1) forwards; transform: scaleX(0); }
    @keyframes grow { to { transform: scaleX(1); } }
    @media (prefers-color-scheme: dark) {
      .title { fill: #c27bff; }
      .label { fill: #9198a1; }
      .value { fill: #f0f6fc; }
    }
  </style>
  <rect class="card" x=".5" y=".5" width="439" height="199" rx="16"/>
  <text class="title" x="24" y="38">Estatísticas do GitHub</text>
  <g class="row" style="animation-delay:0.00s">
    <circle class="icon" cx="29" cy="73" r="4"/>
    <text class="label" x="42" y="78">Contribuições no ano</text>
    <text class="value" x="42" y="96">168</text>
  </g>
  <g class="row" style="animation-delay:0.08s">
    <circle class="icon" cx="29" cy="111" r="4"/>
    <text class="label" x="42" y="116">Commits no ano</text>
    <text class="value" x="42" y="134">123</text>
  </g>
  <g class="row" style="animation-delay:0.16s">
    <circle class="icon" cx="29" cy="149" r="4"/>
    <text class="label" x="42" y="154">Pull requests</text>
    <text class="value" x="42" y="172">30</text>
  </g>
  <g class="row" style="animation-delay:0.24s">
    <circle class="icon" cx="237" cy="73" r="4"/>
    <text class="label" x="250" y="78">Issues</text>
    <text class="value" x="250" y="96">1</text>
  </g>
  <g class="row" style="animation-delay:0.32s">
    <circle class="icon" cx="237" cy="111" r="4"/>
    <text class="label" x="250" y="116">Repositórios públicos</text>
    <text class="value" x="250" y="134">12</text>
  </g>
  <g class="row" style="animation-delay:0.40s">
    <circle class="icon" cx="237" cy="149" r="4"/>
    <text class="label" x="250" y="154">Estrelas recebidas</text>
    <text class="value" x="250" y="172">4</text>
  </g>
</svg>
